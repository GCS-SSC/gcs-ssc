name: Build and Deploy Demo to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize public workspace submodules
        shell: bash
        run: |
          mapfile -t workspace_submodules < <(
            git config --file .gitmodules --get-regexp path |
              awk '$2 != "tooling/gcs-ssc" { print $2 }'
          )
          git submodule update --init --recursive -- "${workspace_submodules[@]}"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install browser for artifact verification
        run: bun x playwright install --with-deps chromium

      - name: Build and stage WebContainer Preview
        run: |
          bun run build:demo
          bun run scripts/webcontainer.ts --from-output --stage-demo .output webcontainer-preview
        env:
          NITRO_PRESET: node-server

      - name: Require private verification credential
        env:
          PRIVATE_TOOLING_READ_TOKEN: ${{ secrets.PRIVATE_TOOLING_READ_TOKEN }}
        run: |
          if [ -z "$PRIVATE_TOOLING_READ_TOKEN" ]; then
            echo '::error::Configure PRIVATE_TOOLING_READ_TOKEN with Contents: read access to GCS-SSC/gcs-ssc-tooling for artifact verification.' >&2
            exit 1
          fi

      - name: Resolve pinned verification tooling
        id: verification-tooling
        run: |
          commit=$(git ls-tree HEAD tooling/gcs-ssc | awk '{print $3}')
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::The host commit must pin tooling/gcs-ssc to an immutable gitlink.' >&2
            exit 1
          fi
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned private verification tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GCS-SSC/gcs-ssc-tooling
          ref: ${{ steps.verification-tooling.outputs.commit }}
          path: tooling/gcs-ssc
          token: ${{ secrets.PRIVATE_TOOLING_READ_TOKEN }}
          persist-credentials: false

      - name: Verify the staged WebContainer Preview
        run: bun run scripts/test-webcontainer-artifact.ts .agent/reports/webcontainer-output webcontainer-preview

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './webcontainer-preview'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
