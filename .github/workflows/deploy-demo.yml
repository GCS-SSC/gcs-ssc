name: Build and Deploy Demo to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize public workspace submodules
        shell: bash
        run: |
          mapfile -t workspace_submodules < <(
            git config --file .gitmodules --get-regexp path |
              awk '$2 != "tooling/gcs-ssc" { print $2 }'
          )
          git submodule update --init --recursive -- "${workspace_submodules[@]}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install browser for artifact verification
        run: bun x playwright install --with-deps chromium

      - name: Build, stage, and verify WebContainer Preview
        run: |
          bun run build
          bun run scripts/webcontainer.ts --from-output --stage-demo .output webcontainer-preview
          bun run scripts/test-webcontainer-artifact.ts .agent/reports/webcontainer-output webcontainer-preview
        env:
          NITRO_PRESET: node-server

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './webcontainer-preview'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
