name: Build and publish shared demo image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: demo-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize pinned public workspace submodules
        run: |
          mapfile -t workspaces < <(
            git config --file .gitmodules --get-regexp path |
              awk '$2 != "tooling/gcs-ssc" { print $2 }'
          )
          git submodule update --init --recursive -- "${workspaces[@]}"

      - name: Set image name
        id: image
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}-demo"
          echo "tag=${repository}:sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build shared image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.image.outputs.tag }}
          build-args: |
            ENVIRONMENT_TYPE=demo
            AWS_RDS_CA_BUNDLE=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=demo-image
          cache-to: type=gha,mode=max,scope=demo-image

      - name: Verify startup and persisted demo files
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: bash scripts/test-container-image.sh "$IMAGE"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the verified image and release pin
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          docker push "$IMAGE"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          if [[ ! "$reference" =~ ^ghcr\.io/.+-demo@sha256:[a-f0-9]{64}$ ]]; then
            echo '::error::Registry did not return a digest-pinned demo image'
            exit 1
          fi
          jq -n --arg image "$reference" '{image: $image}' > deployment/demo-image.json
          printf 'Shared demo image: `%s`\n\nDownload the demo-image artifact and promote its demo-image.json to deployment/demo-image.json.\n' "$reference" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release pin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-image
          path: deployment/demo-image.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify anonymous pulls
        run: |
          reference=$(jq -r .image deployment/demo-image.json)
          registry_config=$(mktemp -d)
          trap 'rm -rf "$registry_config"' EXIT
          if ! docker --config "$registry_config" pull "$reference"; then
            echo '::error::The image must be public. For a new GHCR package, set Package settings > Change visibility > Public, then verify the digest from the demo-image artifact can be pulled anonymously.'
            exit 1
          fi
