# Generated from tooling/gcs-ssc/workflows/quality.yml; edit the private canonical source.
name: Quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Reject untrusted fork source before private access
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo '::error::Private quality tooling is unavailable to fork pull requests. A maintainer must review and test this change on a trusted repository branch.' >&2
          exit 1

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require private verification credential
        env:
          PRIVATE_TOOLING_READ_TOKEN: ${{ secrets.PRIVATE_TOOLING_READ_TOKEN }}
        run: |
          if [ -z "$PRIVATE_TOOLING_READ_TOKEN" ]; then
            echo '::error::Configure PRIVATE_TOOLING_READ_TOKEN with Contents: read access to GCS-SSC/gcs-ssc-tooling. Quality checks cannot run without it.' >&2
            exit 1
          fi

      - name: Resolve pinned private tooling
        id: tooling
        run: |
          commit=$(git ls-tree HEAD tooling/gcs-ssc | awk '{print $3}')
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::The host commit must pin tooling/gcs-ssc to an immutable gitlink.' >&2
            exit 1
          fi
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned private tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GCS-SSC/gcs-ssc-tooling
          ref: ${{ steps.tooling.outputs.commit }}
          path: tooling/gcs-ssc
          token: ${{ secrets.PRIVATE_TOOLING_READ_TOKEN }}
          persist-credentials: false

      - name: Initialize pinned public SDK and extension workspaces
        run: |
          mapfile -t workspaces < <(
            git config --file .gitmodules --get-regexp path |
              awk '$2 != "tooling/gcs-ssc" { print $2 }'
          )
          git submodule update --init --recursive -- "${workspaces[@]}"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Initialize private command bridges
        run: bun run tooling:setup

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run required quality gates
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run quality:ci
